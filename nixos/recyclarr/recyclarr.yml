      - trash_id: d1498e7d189fbe6c7110ceaabb7473e6   # WEB-2160p
        name: 4K first
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_quality: WEB 2160p
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Bluray-2160p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
      - trash_id: 72dae194fc92bf828f32cde7744e51a1   # WEB-1080p
        name: 1080p keep
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 0        # no custom-format chasing: once a file is WEB/Bluray 1080p it stays
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
