# TRaSH-Guides profiles for lab, via Recyclarr.
#
# Design (agreed with Ilya):
#   "4K first"          – new/requested items: 2160p WEB/Bluray first, 1080p as fallback.
#   "1080p keep"        – existing library: good 1080p stops here; only junk below WEB 1080p
#                         (CAM/TS/HDTV/480p) is replaced.
#   "Fallback (720p ok)"– escape hatch for rare media that has no 1080p+ release.
# Remux qualities are deliberately absent everywhere (Ilya does not want 20-60 GB files).
# DV scoring stays on (DV plays fine on his setup); MULTi is scored for Russian dual-audio discs.
#
# API keys come from the environment so they never live in this file.

radarr:
  radarr:
    base_url: http://127.0.0.1:7878
    api_key: !env_var RADARR_API_KEY
    delete_old_custom_formats: false
    quality_definition:
      type: movie
    quality_profiles:
      - trash_id: 64fb5f9858489bdac2af690e27c8f42f   # UHD Bluray + WEB
        name: 4K first
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_quality: Bluray-2160p
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-2160p
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: HDTV-1080p
      - trash_id: d1d67249d3890e49bc12e275d989a7e9   # HD Bluray + WEB
        name: 1080p keep
        reset_unmatched_scores:
          enabled: false
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 0        # no custom-format chasing: once a file is WEB/Bluray 1080p it stays
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: HDTV-1080p
      - name: Fallback (720p ok)
        upgrade:
          allowed: true
          until_quality: WEB 1080p
        quality_sort: top
        qualities:
          - name: Bluray-1080p
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: HDTV-1080p
          - name: Bluray-720p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: HDTV-720p
    custom_format_groups:
      add:
        - trash_id: ff204bbcecdd487d1cefcefdbf0c278d   # [Optional] Golden Rule UHD
        - trash_id: 1616617ab3a14397a2b2321bcbda44d1   # [HDR Formats] DV Boost
        - trash_id: a3ac6af01d78e4f21fcb75f601ac96df   # [Unwanted] Unwanted Formats
        - trash_id: 9337080378236ce4c0b183e35790d2a7   # [Optional] Miscellaneous
          select:
            - 4b900e171accbfb172729b63323ea8ca         # MULTi

sonarr:
